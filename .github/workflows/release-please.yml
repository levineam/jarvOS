name: Release Please

on:
  push:
    branches:
      - main

# Mint a short-lived App installation token rather than storing an expiring token
# or using the default Actions token, so Release Please can trigger the trusted
# release workflow after its PR is merged.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.JARVOS_RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.JARVOS_RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: jarvOS
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
