name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Nightly full link check (and the rest of CI) on main, because pull
  # requests only check the links in the markdown files they change.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint markdown files
        run: |
          # Lint all .md files; ignore node_modules and .github internals
          if [[ -f .markdownlint.json ]]; then
            markdownlint '**/*.md' \
              --ignore 'node_modules/**' \
              --ignore '.github/**' \
              --config .markdownlint.json
          else
            markdownlint '**/*.md' \
              --ignore 'node_modules/**' \
              --ignore '.github/**' \
              --disable MD009 MD012 MD013 MD022 MD026 MD029 MD031 MD032 MD033 MD034 MD036 MD040 MD041 MD060
          fi

  # Pull requests check only the markdown files they add, modify or rename,
  # so a PR waits on its own docs instead of on all ~200 files (the full check
  # took ~3 minutes, mostly external URLs). Pushes to main, the nightly
  # schedule and manual runs still check every file. A guard step fails the
  # job if any changed markdown file was not actually checked, so the
  # narrowing can never silently skip a file. Broken links themselves stay
  # non-blocking warnings, as before.
  link-check:
    name: Link check
    runs-on: ubuntu-latest
    outputs:
      had_broken_links: ${{ steps.markdown_links.outcome == 'failure' || steps.changed_links.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history (blobless, so still small) so the PR diff can find
        # its merge base with the base branch.
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Check markdown links (all files)
        id: markdown_links
        if: github.event_name != 'pull_request'
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368  # v1
        # Intentionally using action defaults (no repo-local markdown-link-check override).
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          folder-path: '.'
          file-extension: '.md'
        # Treat broken links as warnings, not hard failures, for doc repos
        continue-on-error: true

      - name: List markdown files changed by this pull request
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Added, copied, modified, renamed or type-changed .md files (not
          # deleted ones), outside node_modules, matching the full check.
          git diff --name-only -z --diff-filter=ACMRT "$BASE_SHA"...HEAD -- '*.md' ':(exclude,glob)**/node_modules/**' \
            > "$RUNNER_TEMP/changed-md.z"
          tr '\0' '\n' < "$RUNNER_TEMP/changed-md.z" > "$RUNNER_TEMP/changed-md.txt"
          echo "Changed markdown files: $(grep -c . "$RUNNER_TEMP/changed-md.txt" || true)"
          cat "$RUNNER_TEMP/changed-md.txt"

      - name: Check markdown links (changed files)
        id: changed_links
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          # Plain output, so the guard below can match "FILE: <path>" lines.
          FORCE_COLOR: '0'
        # Same markdown-link-check version and default config as the action above.
        run: |
          set -uo pipefail
          : > "$RUNNER_TEMP/link-check.log"
          if [[ ! -s "$RUNNER_TEMP/changed-md.z" ]]; then
            echo "No markdown files changed; nothing to check."
            exit 0
          fi
          npm install -g --silent markdown-link-check@3.8.7
          status=0
          while IFS= read -r -d '' file; do
            markdown-link-check -q -- "$file" 2>&1 | tee -a "$RUNNER_TEMP/link-check.log" || status=1
          done < "$RUNNER_TEMP/changed-md.z"
          if [[ "$status" != 0 ]]; then
            echo "Broken markdown links detected in changed files (non-blocking)."
          fi
          exit "$status"
        # Treat broken links as warnings, not hard failures, for doc repos
        continue-on-error: true

      # Not continue-on-error: this is the safety net for the narrowing above.
      # Every changed markdown file must appear in markdown-link-check's own
      # output ("FILE: <path>"), or the job fails.
      - name: Guard - every changed markdown file was checked
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          checked=0
          while IFS= read -r -d '' file; do
            if sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/link-check.log" | grep -Fxq -- "FILE: $file"; then
              checked=$((checked + 1))
            else
              echo "::error::Changed markdown file was not link-checked: $file"
              missing=$((missing + 1))
            fi
          done < "$RUNNER_TEMP/changed-md.z"
          echo "Guard: $checked changed markdown file(s) checked, $missing missing."
          [[ "$missing" == 0 ]]

      - name: Surface non-blocking link-check warning
        if: steps.markdown_links.outcome == 'failure' || steps.changed_links.outcome == 'failure'
        run: echo "Broken markdown links detected. See the link-check job logs."

  meta-hygiene:
    name: Meta hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate metadata JSON
        run: python3 -m json.tool docs/meta/source-to-export-map.json > /dev/null

      - name: Ensure metadata does not leak absolute local paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import sys

          source_map_path = pathlib.Path("docs/meta/source-to-export-map.json")
          data = json.loads(source_map_path.read_text())
          absolute_path = re.compile(r'^(?:/|[A-Za-z]:(?:/|\\))')

          def is_absolute_local_path(value: str) -> bool:
              return bool(absolute_path.match(value)) or value.startswith("\\")

          def walk(value, pointer: str = "$") -> None:
              if isinstance(value, str):
                  if is_absolute_local_path(value):
                      print(f"Absolute local path leak detected at {pointer}: {value}")
                      sys.exit(1)
                  return

              if isinstance(value, dict):
                  for key, child in value.items():
                      if isinstance(key, str) and is_absolute_local_path(key):
                          print(f"Absolute local path leak detected at {pointer}.{key}: {key}")
                          sys.exit(1)
                      walk(child, f"{pointer}.{key}")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f"{pointer}[{index}]")

          walk(data)
          PY

      - name: Check workflow and metadata files for trailing whitespace
        shell: bash
        run: |
          set -euo pipefail
          if grep -nHE '[[:blank:]]+$' .github/workflows/*.yml docs/meta/*.json; then
            echo "Trailing whitespace detected in workflow or metadata files"
            exit 1
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan changed lines for common secret patterns
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          sensitive_exts=(
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
            '*.py' '*.sh' '*.bash'
            '*.yml' '*.yaml' '*.json' '*.toml' '*.ini' '*.cfg'
            '.env*'
          )

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git grep -nI '' -- "${sensitive_exts[@]}" ':!.github/workflows/ci.yml' \
              | bash scripts/filter-secret-scan-candidates.sh; then
              echo "Potential secret pattern detected in repository history scan."
              exit 1
            fi
          else
            if git diff -U0 "$base"...HEAD -- "${sensitive_exts[@]}" ':!.github/workflows/ci.yml' \
              | bash scripts/filter-secret-scan-candidates.sh; then
              echo "Potential secret pattern detected in changed content."
              exit 1
            fi
          fi

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run smoke test on clean checkout
        shell: bash
        run: bash scripts/smoke-test.sh

  # The repo's own `npm test` is a 15-command chain covering every module's
  # unit tests (ontology, agent-context, control-plane, coding, runtime-kit)
  # plus doctor/pack/release-readiness/ship-gate suites. Until this job
  # existed, CI ran only `scripts/smoke-test.sh` — one link in that chain —
  # so the module unit tests never executed on a PR or on main, including the
  # control-plane tests gating the headline v0.7.0 capability. The README's
  # documented Quick Start is literally `npm test`, so CI now runs exactly
  # what the docs tell a new user to run.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # Required: the suite's schema tests require `ajv` (a declared
      # dependency), so `npm test` on a bare checkout fails with
      # MODULE_NOT_FOUND rather than a real assertion failure.
      - name: Install dependencies
        run: npm ci

      - name: Run the full test suite
        shell: bash
        run: npm test

  desktop-tests:
    name: Desktop tests and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --include=dev
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - name: Require current prebuilt assets
        run: git diff --exit-code -- apps/desktop/static/chat

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs:
      - markdown-lint
      - link-check
      - meta-hygiene
      - secret-scan
      - smoke-test
      - unit-tests
      - desktop-tests
    if: always()
    steps:
      - name: Summarize results
        shell: bash
        run: |
          set -euo pipefail
          echo "markdown-lint      : ${{ needs.markdown-lint.result }}"
          if [[ "${{ needs.link-check.outputs.had_broken_links }}" == "true" ]]; then
            echo "link-check         : warning (broken links detected; non-blocking)"
          else
            echo "link-check         : ${{ needs.link-check.result }}"
          fi
          echo "meta-hygiene       : ${{ needs.meta-hygiene.result }}"
          echo "secret-scan        : ${{ needs.secret-scan.result }}"
          echo "smoke-test         : ${{ needs.smoke-test.result }}"
          echo "unit-tests         : ${{ needs.unit-tests.result }}"
          echo "desktop-tests      : ${{ needs.desktop-tests.result }}"

          for r in "${{ needs.markdown-lint.result }}" "${{ needs.link-check.result }}" "${{ needs.meta-hygiene.result }}" "${{ needs.secret-scan.result }}" "${{ needs.smoke-test.result }}" "${{ needs.unit-tests.result }}" "${{ needs.desktop-tests.result }}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "One or more CI jobs failed/cancelled."
              exit 1
            fi
          done

          echo "CI summary: OK"
