<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jarvOS Desktop</title>
<link rel="stylesheet" href="/style.css">
<script src="/lib/marked.min.js" defer></script>
<script src="/lib/purify.min.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<aside class="sidebar">
  <div class="drag-strip" aria-hidden="true"></div>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">◍</span>
    <span class="brand-name">jarv<em>OS</em></span>
  </div>
  <div class="brand-sub">the operating layer</div>

  <nav class="nav" aria-label="Pages">
    <a href="#/chat" data-page="chat">
      <svg viewBox="0 0 24 24"><path d="M4.5 5.5h15v10a2 2 0 0 1-2 2H10l-4.5 3v-3h-1a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"/><path d="M8 10h8M8 13.5h5"/></svg>
      <span>Chat</span>
    </a>
    <a href="#/today" data-page="today">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
      <span>Today</span>
    </a>
    <a href="#/journal" data-page="journal">
      <svg viewBox="0 0 24 24"><path d="M5 3.5h11.5a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5z"/><path d="M5 3.5v17M8.5 8h6.5M8.5 12h6.5"/></svg>
      <span>Journal</span>
    </a>
    <a href="#/notes" data-page="notes">
      <svg viewBox="0 0 24 24"><path d="M4.5 4.5h15v10.5l-4.5 4.5H4.5z"/><path d="M15 19.5V15h4.5"/></svg>
      <span>Notes</span>
    </a>
    <a href="#/work" data-page="work">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8.5 5V3.2M15.5 5V3.2M3.5 9.5h17"/></svg>
      <span>Work</span>
    </a>
    <a href="#/memory" data-page="memory">
      <svg viewBox="0 0 24 24"><path d="M12 4a5 5 0 0 0-5 5v1.5A3.5 3.5 0 0 0 5.5 14 3.5 3.5 0 0 0 9 17.5h6a3.5 3.5 0 0 0 3.5-3.5 3.5 3.5 0 0 0-1.5-3.5V9a5 5 0 0 0-5-5z"/><path d="M12 17.5V21"/></svg>
      <span>Memory</span>
    </a>
    <a href="#/ontology" data-page="ontology">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><circle cx="5.5" cy="18" r="2.2"/><circle cx="18.5" cy="18" r="2.2"/><path d="M11 7l-4 9M13 7l4 9M7.7 18h8.6"/></svg>
      <span>Ontology</span>
    </a>
    <a href="#/services" data-page="services">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.5l3 2.5"/></svg>
      <span>Services</span>
    </a>
  </nav>

  <div class="sidebar-foot">
    <div class="pulse-row" id="pulse-row" title="Service health">
      <span class="pulse-dot" id="pulse-dot"></span>
      <span id="pulse-label">checking…</span>
    </div>
    <div class="foot-note">local-first · nothing leaves this machine</div>
  </div>
</aside>

<main class="main" id="main" tabindex="-1"></main>

</body>
</html>
